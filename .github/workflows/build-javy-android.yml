name: Build Javy for Termux (arm64 Android)

on:
  workflow_dispatch: {}

jobs:
  build-android-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Javy source
        uses: actions/checkout@v4
        with:
          repository: bytecodealliance/javy
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Set NDK env vars
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          TOOLCHAIN="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$TOOLCHAIN" >> $GITHUB_PATH
          echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang" >> $GITHUB_ENV
          echo "CXX_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang++" >> $GITHUB_ENV
          echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android24-clang" >> $GITHUB_ENV

      - name: Build Javy CLI for aarch64-linux-android
        run: cargo build --release --target aarch64-linux-android -p javy-cli

      - name: Rename and prepare artifact
        run: |
          mkdir -p dist
          cp target/aarch64-linux-android/release/javy dist/javy-android-arm64
          chmod +x dist/javy-android-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: javy-android-arm64
          path: dist/javy-android-arm64
